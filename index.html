<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yandere</title>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400;1,500&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">

<style>

:root{
  
  --void:        #05020a;   
  --dusk:        #170a16;   
  --crimson:     #a3122f;   
  --crimson-deep:#5c0a1e;   
  --rose-dark:   #6e2140;   
  --ivory:       #f4e9df;   
  --gold:        #cda45e;   
  --gold-soft:   #e8cf9a;
  --leaf:        #223321;   

  
  --font-display: 'Cormorant Garamond', serif;
  --font-label:   'Cinzel', serif;

  
  --ease-silk: cubic-bezier(.22,.61,.36,1);
}

*{ box-sizing: border-box; }

html, body{
  margin:0; padding:0;
  width:100%; height:100%;
  background: var(--void);
  overflow: hidden;
  cursor: none;
  font-family: var(--font-display);
}

#cursor-core{
  position: fixed; top:0; left:0; width:6px; height:6px;
  margin:-3px 0 0 -3px;
  border-radius:50%;
  background: var(--gold-soft);
  box-shadow: 0 0 8px 2px var(--gold);
  pointer-events:none; z-index: 9999;
  transition: transform .08s var(--ease-silk);
}
#cursor-glow{
  position: fixed; top:0; left:0; width:46px; height:46px;
  margin:-23px 0 0 -23px;
  border-radius:50%;
  background: radial-gradient(circle, rgba(163,18,47,.35), rgba(163,18,47,0) 70%);
  pointer-events:none; z-index: 9998;
  transition: transform .25s var(--ease-silk), opacity .3s ease;
}

#sky{
  position: fixed; inset:0;
  background:
    radial-gradient(ellipse at 50% 18%, rgba(92,10,30,.35), transparent 55%),
    linear-gradient(180deg, var(--void) 0%, var(--dusk) 55%, #100713 100%);
  z-index:0;
}

#stars-canvas{
  position: fixed; inset:0; z-index:1;
}

#moon-wrap{
  position: fixed; top:8%; left:50%;
  width: 180px; height:180px;
  transform: translate(-50%,0);
  z-index:1;
  will-change: transform;
}
#moon{
  position:absolute; inset:20px;
  border-radius:50%;
  background: radial-gradient(circle at 38% 32%, #fff8ec, var(--gold-soft) 45%, #b98f57 100%);
  box-shadow:
    0 0 40px 10px rgba(232,207,154,.55),
    0 0 90px 30px rgba(163,18,47,.18);
  animation: moon-breathe 8s ease-in-out infinite;
}
#moon-halo{
  position:absolute; inset:-40px;
  border-radius:50%;
  background: radial-gradient(circle, rgba(232,207,154,.14), transparent 70%);
  animation: moon-breathe 8s ease-in-out infinite reverse;
}
@keyframes moon-breathe{
  0%,100%{ filter:brightness(1) blur(0px); }
  50%{ filter:brightness(1.12) blur(.4px); }
}

.fog-layer{
  position: fixed; left:-20%; width:140%; height:40%;
  z-index:2; pointer-events:none;
  background: linear-gradient(180deg, transparent, rgba(110,33,64,.18) 40%, transparent 80%);
  filter: blur(18px);
  mix-blend-mode: screen;
}
#fog-1{ bottom:-4%;  height:34%; animation: drift 38s linear infinite; opacity:.55; }
#fog-2{ bottom:6%;   height:28%; animation: drift 55s linear infinite reverse; opacity:.4; }
#fog-3{ bottom:-10%; height:46%; animation: drift 70s linear infinite; opacity:.3; }
@keyframes drift{
  0%{ transform: translateX(-6%); }
  50%{ transform: translateX(6%); }
  100%{ transform: translateX(-6%); }
}

#particles-canvas{
  position: fixed; inset:0; z-index:3; pointer-events:none;
}

#scene-wrap{
  position: fixed; inset:0; z-index:4;
  display:flex; align-items:center; justify-content:center;
  perspective: 1400px;
}
#scene{
  width: min(46vw, 620px);
  height: min(46vw, 620px);
  overflow: visible;
  filter: drop-shadow(0 30px 60px rgba(0,0,0,.55));
  transition: transform .35s var(--ease-silk);
  will-change: transform;
}

#ripple-field{
  position:absolute; inset:0; pointer-events:none;
}
.ripple{
  position:absolute; border-radius:50%;
  border:1px solid rgba(232,207,154,.55);
  box-shadow: 0 0 24px 2px rgba(232,207,154,.25) inset;
  top:50%; left:50%;
  transform: translate(-50%,-50%);
  animation: ripple-out 2.2s var(--ease-silk) forwards;
}
@keyframes ripple-out{
  0%{ width:0; height:0; opacity:.9; }
  100%{ width:1100px; height:1100px; opacity:0; }
}

}

#sound-toggle{
  position: fixed; top: 5%; right: 5%; z-index: 6;
  display:flex; align-items:center; gap:8px;
  padding: 10px 18px;
  border-radius: 999px;
  border: 1px solid rgba(232,207,154,.25);
  background: rgba(23,10,22,.4);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  color: var(--gold-soft);
  font-family: var(--font-label);
  font-size: 11px; letter-spacing: .22em; text-transform: uppercase;
  cursor: none;
  transition: box-shadow .3s ease, border-color .3s ease, transform .2s ease;
}
#sound-toggle:hover{ box-shadow: 0 0 22px rgba(232,207,154,.25); border-color: rgba(232,207,154,.55); transform: translateY(-1px); }
#sound-toggle.active .icon{ animation: pulse-note 1.4s ease-in-out infinite; }
@keyframes pulse-note{ 0%,100%{ opacity:.6; } 50%{ opacity:1; } }

#message-wrap{
  position: fixed; inset:0; z-index:7;
  display:flex; align-items:center; justify-content:center;
  padding: 0 8%;
  pointer-events:none;
  opacity:0;
  transition: opacity 2s ease;
}
#message-wrap.visible{ opacity:1; }
#message-text{
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 500;
  font-size: clamp(22px, 2.6vw, 40px);
  line-height:1.5;
  text-align:center;
  color: var(--ivory);
  text-shadow:
    0 0 18px rgba(232,207,154,.55),
    0 0 44px rgba(163,18,47,.35);
  letter-spacing: .01em;
}
#message-text .cursor-blink{
  display:inline-block; width: .06em;
  border-right: 2px solid var(--gold-soft);
  animation: blink 1s step-end infinite;
  margin-left:2px;
}
@keyframes blink{ 50%{ border-color: transparent; } }

body.opening body.bloomed #sky{ transition: filter 3s ease; filter: hue-rotate(-14deg) brightness(1.15); }

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{ animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}

@media (max-width: 900px){
  #scene{ width: 80vw; height: 80vw; }
  #message-text{ font-size: clamp(18px, 4.4vw, 28px); }
}

  </style>
</head>
<body>

  
  <div id="sky"></div>

  <canvas id="stars-canvas"></canvas>

  <div id="moon-wrap">
    <div id="moon"></div>
    <div id="moon-halo"></div>
  </div>

  <div class="fog-layer" id="fog-1"></div>
  <div class="fog-layer" id="fog-2"></div>
  <div class="fog-layer" id="fog-3"></div>

  
  <canvas id="particles-canvas"></canvas>

  
  <div id="scene-wrap">
    <svg id="scene" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
      <defs id="scene-defs"></defs>
      <g id="ground-glow"></g>
      <g id="bouquet-root"></g>
      <g id="lotus-root" opacity="0"></g>
    </svg>

    
    <div id="ripple-field"></div>
  </div>

  

  <button id="sound-toggle" aria-label="Activar sonido ambiental">
    <span class="icon">♪</span><span class="label">sonido</span>
  </button>

  <div id="message-wrap">
    <p id="message-text"></p>
  </div>

  
  <div id="cursor-core"></div>
  <div id="cursor-glow"></div>

  <script>


const SVG_NS = 'http://www.w3.org/2000/svg';

const rand      = (min, max) => min + Math.random() * (max - min);
const clamp     = (v, min, max) => Math.max(min, Math.min(max, v));
const lerp      = (a, b, t) => a + (b - a) * t;
const toRad     = (deg) => deg * Math.PI / 180;

function svgEl(tag, attrs = {}) {
  const el = document.createElementNS(SVG_NS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

const starsCanvas = document.getElementById('stars-canvas');
const starsCtx = starsCanvas.getContext('2d');
let stars = [];

function resizeStars() {
  starsCanvas.width = window.innerWidth * devicePixelRatio;
  starsCanvas.height = window.innerHeight * devicePixelRatio;
  starsCanvas.style.width = window.innerWidth + 'px';
  starsCanvas.style.height = window.innerHeight + 'px';
  starsCtx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);

  const count = Math.floor((window.innerWidth * window.innerHeight) / 3200);
  stars = Array.from({ length: count }, () => ({
    x: rand(0, window.innerWidth),
    y: rand(0, window.innerHeight * 0.75),
    r: rand(0.4, 1.6),
    phase: rand(0, Math.PI * 2),
    speed: rand(0.5, 1.4)
  }));
}

function drawStars(t) {
  starsCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  for (const s of stars) {
    const twinkle = 0.45 + 0.55 * Math.sin(t * 0.001 * s.speed + s.phase);
    starsCtx.beginPath();
    starsCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    starsCtx.fillStyle = `rgba(244,233,223,${(0.15 + 0.65 * twinkle).toFixed(3)})`;
    starsCtx.fill();
  }
}

const pCanvas = document.getElementById('particles-canvas');
const pCtx = pCanvas.getContext('2d');

let fallingPetals = [];
let sparkles = [];
let butterflies = [];
let hearts = [];

function resizeParticles() {
  pCanvas.width = window.innerWidth * devicePixelRatio;
  pCanvas.height = window.innerHeight * devicePixelRatio;
  pCanvas.style.width = window.innerWidth + 'px';
  pCanvas.style.height = window.innerHeight + 'px';
  pCtx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}

function initFallingPetals() {
  const count = Math.floor(window.innerWidth / 70);
  fallingPetals = Array.from({ length: count }, () => spawnPetal(true));
}
function spawnPetal(randomY = false) {
  return {
    x: rand(0, window.innerWidth),
    y: randomY ? rand(-window.innerHeight, window.innerHeight) : -20,
    size: rand(6, 14),
    speedY: rand(10, 26),
    driftAmp: rand(20, 60),
    driftFreq: rand(0.3, 0.8),
    phase: rand(0, Math.PI * 2),
    rot: rand(0, Math.PI * 2),
    rotSpeed: rand(-0.6, 0.6),
    hue: rand(0, 1) > 0.5 ? 'crimson' : 'rose'
  };
}
function drawPetalShape(ctx, size, hue) {

  const grad = ctx.createLinearGradient(-size, -size, size, size);
  if (hue === 'crimson') {
    grad.addColorStop(0, 'rgba(163,18,47,0.9)');
    grad.addColorStop(1, 'rgba(92,10,30,0.65)');
  } else {
    grad.addColorStop(0, 'rgba(110,33,64,0.85)');
    grad.addColorStop(1, 'rgba(60,15,35,0.55)');
  }
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(0, -size);
  ctx.bezierCurveTo(size * 0.9, -size * 0.3, size * 0.6, size * 0.8, 0, size);
  ctx.bezierCurveTo(-size * 0.6, size * 0.8, -size * 0.9, -size * 0.3, 0, -size);
  ctx.fill();
}

function initButterflies() {
  const count = 4;
  butterflies = Array.from({ length: count }, (_, i) => ({
    t: rand(0, 100),
    speed: rand(0.15, 0.28),
    cx: rand(window.innerWidth * 0.15, window.innerWidth * 0.85),
    cy: rand(window.innerHeight * 0.2, window.innerHeight * 0.55),
    rx: rand(120, 260),
    ry: rand(60, 140),
    flap: rand(0, Math.PI * 2),
    size: rand(9, 15)
  }));
}
function drawButterfly(ctx, b, t) {
  b.t += b.speed * 0.016;
  const x = b.cx + Math.cos(b.t) * b.rx;
  const y = b.cy + Math.sin(b.t * 1.7) * b.ry;
  const flap = Math.sin(t * 0.008 + b.flap) * 0.9;

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(Math.cos(b.t) * 0.2);

  const wingGrad = ctx.createLinearGradient(0, -b.size, 0, b.size);
  wingGrad.addColorStop(0, 'rgba(92,10,30,0.85)');
  wingGrad.addColorStop(1, 'rgba(20,6,14,0.75)');
  ctx.fillStyle = wingGrad;

  ctx.save();
  ctx.scale(1, 1);
  ctx.rotate(-0.3 - flap * 0.5);
  ctx.beginPath();
  ctx.ellipse(-b.size * 0.6, 0, b.size, b.size * 0.6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.rotate(0.3 + flap * 0.5);
  ctx.beginPath();
  ctx.ellipse(b.size * 0.6, 0, b.size, b.size * 0.6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  ctx.fillStyle = 'rgba(10,4,8,0.9)';
  ctx.beginPath();
  ctx.ellipse(0, 0, b.size * 0.14, b.size * 0.5, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function spawnSparkle(x, y, opts = {}) {
  sparkles.push({
    x, y,
    size: rand(1, opts.big ? 4 : 2.4),
    life: 0,
    maxLife: rand(600, 1400),
    vx: rand(-0.4, 0.4) * (opts.burst ? 3.4 : 1),
    vy: rand(-0.6, -0.1) * (opts.burst ? 3.4 : 1),
    gold: Math.random() > 0.35
  });
}
function spawnSparkleBurst(x, y, count = 18) {
  for (let i = 0; i < count; i++) spawnSparkle(x, y, { burst: true, big: true });
}

function spawnHeart(x, y) {
  hearts.push({ x, y, life: 0, maxLife: 2600, size: rand(10, 18), drift: rand(-8, 8) });
}
function drawHeart(ctx, h, alpha) {
  const s = h.size;
  ctx.save();
  ctx.translate(h.x, h.y);
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = 'rgba(232,207,154,0.8)';
  ctx.lineWidth = 1.1;
  ctx.beginPath();
  ctx.moveTo(0, s * 0.3);
  ctx.bezierCurveTo(-s, -s * 0.6, -s * 0.2, -s * 1.1, 0, -s * 0.3);
  ctx.bezierCurveTo(s * 0.2, -s * 1.1, s, -s * 0.6, 0, s * 0.3);
  ctx.stroke();
  ctx.restore();
}

let lastFrame = performance.now();
function animateParticles(t) {
  const dt = Math.min(t - lastFrame, 42);
  lastFrame = t;

  pCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);

  for (const p of fallingPetals) {
    p.y += p.speedY * (dt / 1000);
    p.phase += p.driftFreq * (dt / 1000);
    p.rot += p.rotSpeed * (dt / 1000);
    const x = p.x + Math.sin(p.phase) * p.driftAmp * 0.02;
    pCtx.save();
    pCtx.translate(x, p.y);
    pCtx.rotate(p.rot);
    drawPetalShape(pCtx, p.size, p.hue);
    pCtx.restore();
    if (p.y > window.innerHeight + 20) Object.assign(p, spawnPetal(false), { x: rand(0, window.innerWidth) });
  }

  for (const b of butterflies) drawButterfly(pCtx, b, t);

  sparkles = sparkles.filter(s => s.life < s.maxLife);
  for (const s of sparkles) {
    s.life += dt;
    s.x += s.vx; s.y += s.vy;
    const lifeT = s.life / s.maxLife;
    const alpha = Math.sin(lifeT * Math.PI);
    pCtx.beginPath();
    pCtx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    pCtx.fillStyle = s.gold ? `rgba(232,207,154,${alpha})` : `rgba(244,233,223,${alpha})`;
    pCtx.shadowBlur = 8;
    pCtx.shadowColor = s.gold ? '#e8cf9a' : '#f4e9df';
    pCtx.fill();
    pCtx.shadowBlur = 0;
  }

  if (Math.random() < 0.045) {
    spawnSparkle(rand(0, window.innerWidth), rand(window.innerHeight * 0.3, window.innerHeight));
  }

  hearts = hearts.filter(h => h.life < h.maxLife);
  for (const h of hearts) {
    h.life += dt;
    h.y -= 0.012 * dt;
    h.x += h.drift * 0.0006 * dt;
    const lifeT = h.life / h.maxLife;
    const alpha = Math.sin(lifeT * Math.PI) * 0.7;
    drawHeart(pCtx, h, alpha);
  }
  if (Math.random() < 0.006) spawnHeart(rand(window.innerWidth * 0.3, window.innerWidth * 0.7), window.innerHeight * 0.6);

  drawStars(t);
  requestAnimationFrame(animateParticles);
}

const defs      = document.getElementById('scene-defs');
const bouquetRoot = document.getElementById('bouquet-root');
const lotusRoot  = document.getElementById('lotus-root');
const groundGlow = document.getElementById('ground-glow');

function buildDefs() {

  for (let i = 0; i < 4; i++) {
    const g = svgEl('radialGradient', { id: `roseGrad${i}`, cx: '35%', cy: '30%', r: '75%' });
    g.appendChild(svgEl('stop', { offset: '0%',  'stop-color': i % 2 ? '#d43a58' : '#c02744' }));
    g.appendChild(svgEl('stop', { offset: '60%', 'stop-color': '#8f1330' }));
    g.appendChild(svgEl('stop', { offset: '100%','stop-color': '#4a0a1c' }));
    defs.appendChild(g);
  }

  const leafGrad = svgEl('linearGradient', { id: 'leafGrad', x1: '0%', y1: '0%', x2: '100%', y2: '100%' });
  leafGrad.appendChild(svgEl('stop', { offset: '0%', 'stop-color': '#31432c' }));
  leafGrad.appendChild(svgEl('stop', { offset: '100%', 'stop-color': '#131d10' }));
  defs.appendChild(leafGrad);

  const lotusGrad = svgEl('radialGradient', { id: 'lotusGrad', cx: '50%', cy: '85%', r: '90%' });
  lotusGrad.appendChild(svgEl('stop', { offset: '0%',  'stop-color': '#fff9f0' }));
  lotusGrad.appendChild(svgEl('stop', { offset: '55%', 'stop-color': '#f4e0e6' }));
  lotusGrad.appendChild(svgEl('stop', { offset: '100%','stop-color': '#cda45e' }));
  defs.appendChild(lotusGrad);

  const filter = svgEl('filter', { id: 'glow', x: '-60%', y: '-60%', width: '220%', height: '220%' });
  const blur = svgEl('feGaussianBlur', { stdDeviation: '6', result: 'blur' });
  const merge = svgEl('feMerge');
  merge.appendChild(svgEl('feMergeNode', { in: 'blur' }));
  merge.appendChild(svgEl('feMergeNode', { in: 'SourceGraphic' }));
  filter.appendChild(blur);
  filter.appendChild(merge);
  defs.appendChild(filter);

  const softFilter = svgEl('filter', { id: 'softGlow', x: '-80%', y: '-80%', width: '260%', height: '260%' });
  softFilter.appendChild(svgEl('feGaussianBlur', { stdDeviation: '3' }));
  defs.appendChild(softFilter);
}

function petalPath(length, width, curve = 1) {
  const w = width / 2;
  return `M0,0
    C ${-w * curve},${-length * 0.35} ${-w * 0.7},${-length * 0.9} 0,${-length}
    C ${w * 0.7},${-length * 0.9} ${w * curve},${-length * 0.35} 0,0 Z`;
}

function buildRose(size = 1, gradIndex = 0) {
  const rose = svgEl('g', { class: 'rose' });

  const rings = [
    { count: 7, length: 46 * size, width: 30 * size, radiusOffset: 6 * size,  tilt: 18 },
    { count: 6, length: 34 * size, width: 24 * size, radiusOffset: 3 * size,  tilt: 10 },
    { count: 5, length: 22 * size, width: 17 * size, radiusOffset: 0,          tilt: -6 },
  ];

  rings.forEach((ring, ringIndex) => {
    for (let i = 0; i < ring.count; i++) {
      const angle = (360 / ring.count) * i + ringIndex * 14 + rand(-4, 4);

      const orient = svgEl('g', { transform: `rotate(${angle})` });

      const inner = svgEl('g', {
        class: 'petal petal-rose',
        transform: `translate(0,${-ring.radiusOffset}) scale(0.94) rotate(${ring.tilt * 0.3})`
      });
      const p = svgEl('path', {
        d: petalPath(ring.length, ring.width, 1 + ringIndex * 0.15),
        fill: `url(#roseGrad${(gradIndex + ringIndex) % 4})`,
        stroke: 'rgba(20,4,10,0.35)',
        'stroke-width': '0.6'
      });
      inner.appendChild(p);
      orient.appendChild(inner);
      rose.appendChild(orient);
    }
  });

  const bud = svgEl('circle', { r: 5 * size, fill: '#6e1226', class: 'petal-rose' });
  rose.appendChild(bud);

  return rose;
}

function buildLeaf(x, y, rotation, scale = 1) {
  const g = svgEl('g', { transform: `translate(${x},${y}) rotate(${rotation}) scale(${scale})`, class: 'leaf' });
  const path = svgEl('path', {
    d: 'M0,0 C 14,-10 22,-34 0,-56 C -22,-34 -14,-10 0,0 Z',
    fill: 'url(#leafGrad)',
    stroke: 'rgba(0,0,0,.3)', 'stroke-width': '.6'
  });
  const vein = svgEl('path', { d: 'M0,-2 L0,-52', stroke: 'rgba(150,180,120,.35)', 'stroke-width': '1' });
  g.appendChild(path);
  g.appendChild(vein);
  return g;
}

function buildStem(x1, y1, x2, y2, thornCount = 3) {
  const g = svgEl('g', { class: 'stem' });
  const midX = (x1 + x2) / 2 + rand(-14, 14);
  const midY = (y1 + y2) / 2;
  const d = `M${x1},${y1} Q${midX},${midY} ${x2},${y2}`;
  const path = svgEl('path', { d, fill: 'none', stroke: '#26361f', 'stroke-width': 5, 'stroke-linecap': 'round' });
  g.appendChild(path);

  for (let i = 0; i < thornCount; i++) {
    const t = (i + 1) / (thornCount + 1);
    const px = lerp(x1, x2, t);
    const py = lerp(y1, y2, t);
    const dir = i % 2 === 0 ? 1 : -1;
    const thorn = svgEl('path', {
      d: `M${px},${py} l ${6 * dir},${-8} l ${-2 * dir},${9} Z`,
      fill: '#1c2716'
    });
    g.appendChild(thorn);
  }
  return g;
}

function buildBouquet() {
  const layout = [
    { x: 500, y: 430, scale: 1.15, grad: 0 },
    { x: 400, y: 470, scale: 0.85, grad: 1 },
    { x: 610, y: 465, scale: 0.9,  grad: 2 },
    { x: 445, y: 530, scale: 0.7,  grad: 3 },
    { x: 565, y: 535, scale: 0.72, grad: 1 },
  ];

  [[380,560,-50,1.1],[620,555,42,1.05],[500,600,10,1.3],[470,610,-90,0.9],[540,615,95,0.95]]
    .forEach(([x,y,r,s]) => bouquetRoot.appendChild(buildLeaf(x,y,r,s)));

  layout.forEach(pos => bouquetRoot.appendChild(buildStem(pos.x, pos.y + 30, 500, 760, 2)));
  const wrap = svgEl('path', { d: 'M480,745 Q500,780 520,745 L520,770 Q500,800 480,770 Z', fill: '#3a0f10', stroke: 'rgba(205,164,94,.6)', 'stroke-width': 1.4 });
  bouquetRoot.appendChild(wrap);

  layout.forEach(pos => {
    const rose = buildRose(pos.scale, pos.grad);
    rose.setAttribute('transform', `translate(${pos.x},${pos.y})`);
    rose.dataset.baseX = pos.x;
    rose.dataset.baseY = pos.y;
    bouquetRoot.appendChild(rose);
  });
}

let lotusPetals = [];
let lotusStamens = [];

function lotusPetalPath(length, width) {
  const w = width / 2;
  return `M0,0
    C ${-w},${-length * 0.4} ${-w * 0.55},${-length} 0,${-length}
    C ${w * 0.55},${-length} ${w},${-length * 0.4} 0,0 Z`;
}

function buildLotus() {
  const cx = 500, cy = 560;
  const root = svgEl('g', { transform: `translate(${cx},${cy})` });

  const rings = [
    { count: 10, length: 150, width: 66, tone: '#f4e0e6' },
    { count: 8,  length: 112, width: 52, tone: '#f7ead5' },
    { count: 6,  length: 74,  width: 38, tone: '#fff9f0' },
  ];

  rings.forEach((ring, ringIndex) => {
    for (let i = 0; i < ring.count; i++) {
      const angle = (360 / ring.count) * i + ringIndex * (360 / ring.count / 2);
      const orient = svgEl('g', { transform: `rotate(${angle})`, class: 'lotus-orient' });

      const inner = svgEl('g', {
        class: 'petal petal-lotus',
        style: `transform: scale(0.05) rotate(${ringIndex % 2 ? -6 : 6}deg); transform-origin: 0px 0px;`
      });
      const p = svgEl('path', {
        d: lotusPetalPath(ring.length, ring.width),
        fill: 'url(#lotusGrad)',
        stroke: 'rgba(205,164,94,.5)',
        'stroke-width': '0.8',
        filter: ringIndex === 0 ? 'url(#softGlow)' : ''
      });
      inner.appendChild(p);
      orient.appendChild(inner);
      root.appendChild(orient);
      lotusPetals.push({ el: inner, ring: ringIndex, index: i, openTransform: `scale(1) rotate(0deg)` });
    }
  });

  const stamenGroup = svgEl('g', { class: 'stamens', style: 'opacity:0; transition: opacity 1.4s ease .6s;' });
  for (let i = 0; i < 14; i++) {
    const angle = (360 / 14) * i;
    const s = svgEl('g', { transform: `rotate(${angle})` });
    const line = svgEl('path', { d: 'M0,0 L0,-30', stroke: '#cda45e', 'stroke-width': 1.4, 'stroke-linecap': 'round' });
    const tip = svgEl('circle', { cy: -31, r: 2.6, fill: '#e8cf9a' });
    s.appendChild(line); s.appendChild(tip);
    stamenGroup.appendChild(s);
  }
  root.appendChild(stamenGroup);
  lotusStamens.push(stamenGroup);

  const pod = svgEl('circle', { r: 16, fill: '#e8cf9a', style: 'opacity:0; transition: opacity 1s ease .8s;' });
  root.appendChild(pod);
  lotusStamens.push(pod);

  lotusRoot.appendChild(root);
  lotusRoot.dataset.cx = cx;
  lotusRoot.dataset.cy = cy;
}

let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
let smooth = { x: 0, y: 0 };
let bloomStarted = false;

const scene = document.getElementById('scene');
const cursorCore = document.getElementById('cursor-core');
const cursorGlow = document.getElementById('cursor-glow');
const moonWrap = document.getElementById('moon-wrap');

window.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  cursorCore.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
  cursorGlow.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;

  const rect = scene.getBoundingClientRect();
  const withinX = e.clientX > rect.left - 80 && e.clientX < rect.right + 80;
  const withinY = e.clientY > rect.top - 80 && e.clientY < rect.bottom + 80;
  if (withinX && withinY && Math.random() < 0.12) {
    spawnSparkle(e.clientX + rand(-6,6), e.clientY + rand(-6,6));
  }
});

function updateParallaxAndTilt() {
  const nx = (mouse.x / window.innerWidth) - 0.5;
  const ny = (mouse.y / window.innerHeight) - 0.5;

  smooth.x = lerp(smooth.x, nx, 0.06);
  smooth.y = lerp(smooth.y, ny, 0.06);

  const tiltY = smooth.x * 14;
  const tiltX = -smooth.y * 10;
  scene.style.transform = `rotateX(${tiltX}deg) rotateY(${tiltY}deg) translate(${smooth.x * -12}px, ${smooth.y * -8}px)`;

  moonWrap.style.transform = `translate(calc(-50% + ${smooth.x * -20}px), ${smooth.y * -10}px)`;

  if (!bloomStarted) {
    document.querySelectorAll('.rose').forEach((rose, i) => {
      const bx = parseFloat(rose.dataset.baseX);
      const by = parseFloat(rose.dataset.baseY);
      const angleToCursor = Math.atan2(smooth.y, smooth.x) * (180 / Math.PI);
      const wobble = Math.sin(performance.now() * 0.0006 + i) * 2;
      rose.style.transform = `translate(${bx}px,${by}px) rotate(${(angleToCursor * 0.04) + wobble}deg) scale(${1 + Math.sin(performance.now()*0.001+i)*0.01})`;
    });
  }

  requestAnimationFrame(updateParallaxAndTilt);
}

function createRipple() {
  const field = document.getElementById('ripple-field');
  const r = document.createElement('div');
  r.className = 'ripple';
  field.appendChild(r);
  setTimeout(() => r.remove(), 2300);
}

function openBouquetPetals() {
  const petals = Array.from(document.querySelectorAll('.petal-rose'));
  petals.forEach((p, i) => {
    setTimeout(() => {
      if (p.tagName === 'circle') { p.style.transition = 'transform 1s ease'; return; }
      p.style.transition = 'transform 1.3s cubic-bezier(.22,.61,.36,1)';
      p.style.transform = 'scale(1.12) rotate(6deg)';
    }, i * 26);
  });
}

function dissolveBouquet() {
  bouquetRoot.style.transition = 'opacity 1.6s ease, transform 1.6s ease';
  bouquetRoot.style.transform = 'scale(0.82) translateY(20px)';
  bouquetRoot.style.opacity = '0';
  spawnSparkleBurst(window.innerWidth/2, window.innerHeight/2 + 40, 30);
}

function openLotus() {
  lotusRoot.style.transition = 'opacity 1.2s ease';
  lotusRoot.style.opacity = '1';

  const ordered = [...lotusPetals].sort((a,b) => (a.ring - b.ring) || (a.index - b.index));
  ordered.forEach((p, i) => {
    setTimeout(() => {
      p.el.style.transition = 'transform 1.6s cubic-bezier(.22,.61,.36,1)';
      p.el.style.transform = p.openTransform;
      if (i % 3 === 0) {
        const rect = scene.getBoundingClientRect();
        spawnSparkle(rect.left + rect.width/2 + rand(-40,40), rect.top + rect.height/2 + rand(-40,40), { big:true });
      }
    }, i * 70);
  });

  const totalDelay = ordered.length * 70 + 1700;
  setTimeout(() => {
    lotusStamens.forEach(el => el.style.opacity = '1');
    createRipple();
    setTimeout(createRipple, 500);
    finishBloom();
  }, totalDelay);
}

function finishBloom() {
  document.body.classList.add('bloomed');
  lotusRoot.querySelector('g').style.animation = 'lotus-spin 40s linear infinite';
  playChime();
  spawnSparkleBurst(window.innerWidth/2, window.innerHeight/2, 40);
  revealMessage();
}

const styleSheet = document.createElement('style');
styleSheet.textContent = `
@keyframes lotus-spin { from { rotate: 0deg; } to { rotate: 360deg; } }
.petal-lotus, .petal-rose { transform-box: fill-box; transform-origin: center bottom; }
`;
document.head.appendChild(styleSheet);

function beginTransformation() {
  if (bloomStarted) return;
  bloomStarted = true;
  document.body.classList.add('opening');
  createRipple();
  openBouquetPetals();
  setTimeout(dissolveBouquet, 1500);
  setTimeout(openLotus, 2600);
}

scene.addEventListener('click', beginTransformation);
scene.style.cursor = 'none';

let audioCtx = null;
let ambientNodes = null;
let soundOn = false;

function buildAmbientPad() {
  const ctx = audioCtx;
  const master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);

  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 900;
  filter.connect(master);

  const freqs = [110, 164.81, 220];
  const oscs = freqs.map(f => {
    const o = ctx.createOscillator();
    o.type = 'sine';
    o.frequency.value = f;
    const g = ctx.createGain();
    g.gain.value = 0.18;
    o.connect(g).connect(filter);
    o.start();
    return o;
  });

  const lfo = ctx.createOscillator();
  lfo.frequency.value = 0.08;
  const lfoGain = ctx.createGain();
  lfoGain.gain.value = 0.05;
  lfo.connect(lfoGain).connect(master.gain);
  lfo.start();

  master.gain.linearRampToValueAtTime(0.22, ctx.currentTime + 2.5);

  return { master, oscs, lfo, filter };
}

function playChime() {
  if (!audioCtx) return;
  const notes = [523.25, 659.25, 783.99, 987.77];
  notes.forEach((freq, i) => {
    setTimeout(() => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.value = freq;
      g.gain.value = 0.0001;
      o.connect(g).connect(audioCtx.destination);
      o.start();
      g.gain.linearRampToValueAtTime(0.12, audioCtx.currentTime + 0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.4);
      o.stop(audioCtx.currentTime + 1.5);
    }, i * 220);
  });
}

const soundToggle = document.getElementById('sound-toggle');
soundToggle.addEventListener('click', () => {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  soundOn = !soundOn;
  soundToggle.classList.toggle('active', soundOn);

  if (soundOn) {
    ambientNodes = buildAmbientPad();
  } else if (ambientNodes) {
    ambientNodes.master.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1);
    const nodes = ambientNodes;
    setTimeout(() => { nodes.oscs.forEach(o => o.stop()); nodes.lfo.stop(); }, 1100);
    ambientNodes = null;
  }
});

function revealMessage() {
  const wrap = document.getElementById('message-wrap');
  const textEl = document.getElementById('message-text');
  const message = 'Cada pétalo guarda un sentimiento hacia ti.';

  wrap.classList.add('visible');
  textEl.innerHTML = '';
  const cursorSpan = document.createElement('span');
  cursorSpan.className = 'cursor-blink';
  textEl.appendChild(cursorSpan);

  let i = 0;
  const interval = setInterval(() => {
    if (i >= message.length) { clearInterval(interval); return; }
    const char = document.createTextNode(message[i]);
    textEl.insertBefore(char, cursorSpan);
    if (i % 4 === 0) {
      const rect = textEl.getBoundingClientRect();
      spawnSparkle(rect.left + rand(0, rect.width || 200), rect.top + rand(0, 30));
    }
    i++;
  }, 55);
}

function init() {
  resizeStars();
  resizeParticles();
  initFallingPetals();
  initButterflies();
  buildDefs();
  buildBouquet();
  buildLotus();

  requestAnimationFrame(animateParticles);
  requestAnimationFrame(updateParallaxAndTilt);
}

window.addEventListener('resize', () => {
  resizeStars();
  resizeParticles();
});

document.addEventListener('DOMContentLoaded', init);

  </script>
